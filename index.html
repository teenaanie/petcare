<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pippy-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pippy — Pet Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Baloo 2 stands in for Choret Fudyng (titles/headings) and Nunito for
         Bubblebody Neue (body) until the licensed files are available. Both are
         referenced only from index.css, so swapping is a one-line change. -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores the manifest icons; without this the home screen icon is a
         screenshot of the page. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pippy" />
    <meta name="theme-color" content="#F9D548" />
    <!-- Microsoft Clarity — session recording & heatmaps -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "y24xaz7ubd");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Registration used to be fire-and-forget: no update check and no
        // reload, so a client that had cached an old build kept serving it
        // indefinitely. The worker calls skipWaiting() on install, so a new one
        // takes control as soon as it is found — this listens for that and
        // reloads once so the page is not left running the previous bundle.
        var hadController = !!navigator.serviceWorker.controller
        var reloading = false
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          // Not on first install, when there was nothing to replace.
          if (!hadController || reloading) return
          reloading = true
          window.location.reload()
        })

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            reg.update()
            // And whenever the user comes back to the tab, so a long-lived tab
            // picks up a deploy without being closed.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update()
            })
          }).catch(function () {})
        })
      }
    </script>
  </body>
</html>
