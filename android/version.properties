# The one place a release version is set.
#
# versionCode must go UP for every upload. Play remembers every code it has
# accepted and refuses a repeat -- at the end of the upload, not the start.
#
# versionName is what a person reads in the store and in Settings > Apps. It
# has no rules; keep it human.
versionCode=1
versionName=1.0.0
