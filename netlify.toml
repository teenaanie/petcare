[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"
  ignore    = "git diff --quiet HEAD^ HEAD -- . ':(exclude)*.md' ':(exclude)CLAUDE.md'"

[functions]
  node_bundler = "esbuild"

# Morning reminder agent — 7:00 AM IST (1:30 AM UTC) every day
[functions."morning-reminders"]
  schedule = "30 1 * * *"

# The client calls /api/* so the same build works on Vercel, where that is the
# native function path. Map it back to Netlify's location. Must precede the SPA
# catch-all below, since Netlify applies the first matching rule.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Redirect all non-asset requests to index.html (React SPA routing)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
